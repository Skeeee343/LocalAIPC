[local]
localhost ansible_connection=local

# Remote management from Mac (fill once the box has an address).
# First run is local via bootstrap.sh; every run after is from here:
#   make check / make apply  (targets --limit server over SSH)
[server]
localaipc ansible_host=192.168.100.240 ansible_user=localadmin ansible_ssh_private_key_file=~/.ssh/id_ed25519
