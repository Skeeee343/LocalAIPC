--- # LocalAIPC single-host converge. Idempotent: re-run repairs, never wipes.
# Target: --limit local (first install on box) or --limit server (remote from Mac).
- name: converge host
  hosts: all
  become: true
  vars:
    ollama_model: "qwen3:4b" # pinned, see ADR-002
    openclaw_image: "ghcr.io/openclaw/openclaw:2026.9.2@sha256:a8604855b76cd613cbaa45d6db093dc017b09a2faea5dc9cee023fb7ac262250" # GHCR primary, immutable version+digest
    discord_guild_id: "" # private server ID, fill when bot created (ADR-005)
    discord_user_id: "" # owner numeric user ID, fill when bot created
    discord_bot_token: "" # vault only, never commit; written to /opt/localaipc/.env
    tailscale_authkey: "" # vault only, reusable pre-auth key from tailscale.com/admin
    duckdns_domain: "" # DuckDNS subdomain(s), comma-separated; updater runs only when set + token set
    duckdns_token: "" # vault only, from duckdns.org account page
    backup_dir: /var/backups/localaipc
    admin_ssh_key: "" # vault only, Mac admin pubkey (id_ed25519.pub); enables key login
  tasks:
    - name: check for secrets file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/secrets.yml"
      register: secrets_file
      delegate_to: localhost # path is controller-side; the stat module would run it on the target
      become: false

    - name: load secrets file (vault or plaintext, never committed)
      ansible.builtin.include_vars: "{{ playbook_dir }}/secrets.yml"
      when: secrets_file.stat.exists

    - name: remote management (sshd) installed first (later apt failures must never lock us out)
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true

    - name: remote management (sshd) enabled
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: started

    - name: universe repo check (docker-compose-plugin lives here on 26.04)
      ansible.builtin.shell: grep -rq " universe" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null
      register: universe_check
      changed_when: false
      failed_when: false
      # ponytail: grep check until apt_repository module handles DEB822 sources; upgrade path is module + update_cache

    - name: universe repo enabled
      ansible.builtin.command: add-apt-repository -y universe
      when: universe_check.rc != 0

    - name: base packages
      ansible.builtin.apt:
        name: [curl, ca-certificates, docker.io, docker-compose-v2, nvidia-driver-580-server] # 580 = last branch with Pascal P2000; -server = headless, pulls matching utils
        state: present
        update_cache: true

    - name: remote management (Mac admin key)
      ansible.builtin.authorized_key:
        user: "{{ ansible_user | default(ansible_env.SUDO_USER | default('root')) }}"
        key: "{{ admin_ssh_key }}"
        state: present
      when: admin_ssh_key | length > 0

    - name: passwordless sudo for ansible user (key auth already gates SSH)
      ansible.builtin.copy:
        content: "{{ ansible_user | default(ansible_env.SUDO_USER | default('root')) }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ ansible_user | default(ansible_env.SUDO_USER | default('root')) }}"
        mode: "0440"
        validate: visudo -cf %s

    - name: ollama installed (native, GPU passthrough pain avoided)
      ansible.builtin.shell: curl -fsSL https://ollama.com/install.sh | sh
      args: { creates: /usr/local/bin/ollama }

    - name: ollama model pulled (pinned)
      ansible.builtin.command: ollama pull {{ ollama_model }}
      register: pull
      changed_when: "'up to date' not in pull.stdout"
      # ponytail: shell pull until ollama ansible module matures; upgrade path is module + version lock

    - name: compose file from template
      ansible.builtin.template:
        src: compose.yml.j2
        dest: /opt/localaipc/compose.yml
        mode: "0644"
      notify: restart stack

    - name: openclaw image uid (non-root runtime user)
      ansible.builtin.command: docker run --rm {{ openclaw_image }} id -u
      register: oc_uid
      changed_when: false

    - name: openclaw state dir owned by image user (seeded files included)
      ansible.builtin.file:
        path: /opt/localaipc/openclaw-home
        state: directory
        owner: "{{ oc_uid.stdout }}"
        mode: "0755"
        recurse: true
      notify: restart stack

    - name: openclaw base config seeded (boots without onboard)
      ansible.builtin.template:
        src: openclaw.json.j2
        dest: /opt/localaipc/openclaw-home/openclaw.json
        mode: "0644"
      notify: restart stack

    - name: ollama override dir exists
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service.d
        state: directory
        mode: "0755"

    - name: ollama LAN bind (container reaches host daemon)
      ansible.builtin.copy:
        content: "[Service]\nEnvironment=OLLAMA_HOST=0.0.0.0:11434\n"
        dest: /etc/systemd/system/ollama.service.d/lan.conf
        mode: "0644"
      notify: restart ollama

    - name: discord patch fragment from template (ADR-005)
      ansible.builtin.template:
        src: discord.patch.json5.j2
        dest: /opt/localaipc/discord.patch.json5
        mode: "0644" # IDs only (token lives in .env); node-run CLI container must read it

    - name: gateway token generated once (root-only, never committed)
      ansible.builtin.shell: openssl rand -hex 32 > /opt/localaipc/.gateway-token && chmod 600 /opt/localaipc/.gateway-token
      args: { creates: /opt/localaipc/.gateway-token }
      no_log: true

    - name: gateway token read
      ansible.builtin.slurp: { src: /opt/localaipc/.gateway-token }
      register: gw_token_file
      no_log: true

    - name: tokens to env file (vault-sourced, never commit; always present, may be empty pre-trial)
      ansible.builtin.copy:
        content: "DISCORD_BOT_TOKEN={{ discord_bot_token }}\nOPENCLAW_GATEWAY_TOKEN={{ gw_token_file.content | b64decode | trim }}\n"
        dest: /opt/localaipc/.env
        mode: "0600"
      no_log: true

    - name: tailscale installed (bridge to SP machine, ADR-001)
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args: { creates: /usr/bin/tailscale }

    - name: tailscale status
      ansible.builtin.command: tailscale status
      register: ts_status
      changed_when: false
      failed_when: false

    - name: tailscale up (vault key only, never commit)
      ansible.builtin.command: tailscale up --auth-key {{ tailscale_authkey }} --hostname localaipc
      when: ts_status.rc != 0 and tailscale_authkey | length > 0
      no_log: true

    - name: backup script from template
      ansible.builtin.template:
        src: backup.sh.j2
        dest: /opt/localaipc/backup.sh
        mode: "0700"

    - name: backup service installed
      ansible.builtin.copy:
        src: backup.service
        dest: /etc/systemd/system/localaipc-backup.service
        mode: "0644"
      notify: reload systemd

    - name: stack up (converge, no wipe)
      ansible.builtin.command: docker compose -f /opt/localaipc/compose.yml up -d --remove-orphans
      changed_when: false # ponytail: compose reports drift via --check --diff on template task above

    - name: backup timer installed
      ansible.builtin.copy:
        src: backup.timer
        dest: /etc/systemd/system/localaipc-backup.timer
        mode: "0644"
      notify: reload systemd
      # ponytail: payload now lands via backup.sh + backup.service above

    - name: backup timer enabled
      ansible.builtin.systemd:
        name: localaipc-backup.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: duckdns updater script (vault token, root-only)
      ansible.builtin.copy:
        content: "#!/bin/sh\nset -eu\n/usr/bin/curl -fsS 'https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}&ip='\n"
        dest: /opt/localaipc/duckdns.sh
        mode: "0700"
      when: duckdns_domain | length > 0 and duckdns_token | length > 0
      no_log: true

    - name: duckdns service installed
      ansible.builtin.copy:
        content: "[Unit]\nDescription=DuckDNS IP update\n[Service]\nType=oneshot\nExecStart=/opt/localaipc/duckdns.sh\n"
        dest: /etc/systemd/system/duckdns.service
        mode: "0644"
      when: duckdns_domain | length > 0 and duckdns_token | length > 0
      notify: reload systemd

    - name: duckdns timer installed
      ansible.builtin.copy:
        content: "[Unit]\nDescription=DuckDNS IP update (5min)\n[Timer]\nOnBootSec=1min\nOnUnitActiveSec=5min\n[Install]\nWantedBy=timers.target\n"
        dest: /etc/systemd/system/duckdns.timer
        mode: "0644"
      when: duckdns_domain | length > 0 and duckdns_token | length > 0
      notify: reload systemd

    - name: duckdns timer enabled
      ansible.builtin.systemd:
        name: duckdns.timer
        enabled: true
        state: started
        daemon_reload: true
      when: duckdns_domain | length > 0 and duckdns_token | length > 0

  handlers:
    - name: restart stack
      ansible.builtin.command: docker compose -f /opt/localaipc/compose.yml up -d
    - name: restart ollama
      ansible.builtin.systemd:
        name: ollama
        state: restarted
        daemon_reload: true
    - name: reload systemd
      ansible.builtin.systemd: { daemon_reload: true }
